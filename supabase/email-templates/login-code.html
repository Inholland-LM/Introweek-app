<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jouw inlogcode voor LM = YOU</title>
  </head>
  <body style="margin:0;background:#edf0f5;color:#111827;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#edf0f5;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;border:1px solid rgba(227,0,79,0.25);border-radius:22px;background:#ffffff;box-shadow:0 10px 30px rgba(0,0,0,0.06);">
            <tr>
              <td style="padding:30px 30px 12px;text-align:center;">
                <div style="font-size:20px;font-weight:900;letter-spacing:.06em;color:#111827;">
                  LM <span style="color:#e3004f;">=</span> YOU
                </div>
                <div style="margin-top:9px;color:#e3004f;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;">
                  Intro 2026
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:14px 30px 30px;">
                <h1 style="margin:0;color:#111827;font-family:Georgia,'Times New Roman',serif;font-size:31px;line-height:1.15;text-align:center;">
                  Jouw inlogcode
                </h1>
                <p style="margin:16px 0 0;color:#4b5563;font-size:16px;line-height:1.55;text-align:center;">
                  Gebruik deze achtcijferige code om jouw persoonlijke introweek te openen.
                </p>
                <div style="margin:26px 0;padding:20px;border:2px solid #e3004f;border-radius:16px;background:rgba(227,0,79,0.06);color:#e3004f;font-size:34px;font-weight:900;letter-spacing:.24em;text-align:center;">
                  {{ .Token }}
                </div>
                <p style="margin:0;color:#64748b;font-size:14px;line-height:1.55;text-align:center;">
                  Heb je deze code niet zelf aangevraagd? Dan kun je dit bericht veilig negeren.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:18px 0 0;color:#64748b;font-size:12px;line-height:1.5;text-align:center;">
            Leisure &amp; Events Management Amsterdam · Hogeschool Inholland
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
