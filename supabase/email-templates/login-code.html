<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jouw inlogcode voor LM = YOU</title>
  </head>
  <body style="margin:0;background:#041126;color:#f8f4e9;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#041126;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;border:1px solid #38527f;border-radius:22px;background:#071a3d;">
            <tr>
              <td style="padding:30px 30px 12px;text-align:center;">
                <div style="font-size:20px;font-weight:900;letter-spacing:.06em;">
                  LM <span style="color:#f5c352;">=</span> YOU
                </div>
                <div style="margin-top:9px;color:#ffe19a;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;">
                  Intro 2026
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:14px 30px 30px;">
                <h1 style="margin:0;color:#f8f4e9;font-family:Georgia,'Times New Roman',serif;font-size:31px;line-height:1.15;text-align:center;">
                  Jouw inlogcode
                </h1>
                <p style="margin:16px 0 0;color:#adbbd8;font-size:16px;line-height:1.55;text-align:center;">
                  Gebruik deze zescijferige code om jouw persoonlijke introweek te openen.
                </p>
                <div style="margin:26px 0;padding:20px;border:1px solid #f5c352;border-radius:16px;background:#0a2148;color:#ffe19a;font-size:34px;font-weight:900;letter-spacing:.24em;text-align:center;">
                  {{ .Token }}
                </div>
                <p style="margin:0;color:#adbbd8;font-size:14px;line-height:1.55;text-align:center;">
                  Heb je deze code niet zelf aangevraagd? Dan kun je dit bericht veilig negeren.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:18px 0 0;color:#8294b6;font-size:12px;line-height:1.5;text-align:center;">
            Leisure &amp; Events Management Amsterdam · Hogeschool Inholland
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
