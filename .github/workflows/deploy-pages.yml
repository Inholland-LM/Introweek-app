name: Publiceer Introweek-app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: pnpm installeren
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node.js installeren
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Afhankelijkheden installeren
        run: pnpm install --frozen-lockfile

      - name: Productieversie bouwen
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AUTH_ENABLED: ${{ vars.VITE_AUTH_ENABLED }}
          VITE_REALTIME_ENABLED: 'false'

      - name: GitHub Pages configureren
        uses: actions/configure-pages@v5

      - name: Websitepakket uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Website publiceren
        id: deployment
        uses: actions/deploy-pages@v4
